# Compile/flash ONLY for seeed_xiao_esp32s3 with the same flash/PSRAM as the
# project's example. Other boards need their existing hardware configuration.
packages:
  bridge: !include switchbot-keypad-bridge.yaml

# Use the published investigation branch from either HA or a local computer.
# For uncommitted local changes, override bridge_component_source to components.
substitutions:
  bridge_component_source: github://robertoamd90/switchbot-keypad-bridge@feat/keypad-gcm-investigation

esphome:
  on_boot:
    priority: -100
    then:
      - lambda: 'id(keypad_bridge).run_crypto_selftest();'

# Uses the existing untracked secrets.yaml alongside the main configuration.
logger:
  level: DEBUG
  logs:
    switchbot_keypad_bridge: INFO
    switchbot_keypad_bridge.session: DEBUG
